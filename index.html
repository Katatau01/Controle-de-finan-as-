<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Pro</title>

<style>
body {
  background: #0f172a;
  color: white;
  font-family: Arial;
  margin: 0;
}

header {
  padding: 20px;
  font-size: 22px;
  font-weight: bold;
}

.container {
  padding: 15px;
}

.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 10px;
}

h3 { margin-top: 0; }

input, button {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 8px;
  border: none;
}

button {
  background: #22c55e;
  font-weight: bold;
}

.meta {
  font-size: 20px;
  color: #22c55e;
}
</style>
</head>

<body>

<header>💸 Controle Inteligente</header>

<div class="container">

<div class="card">
<h3>Resumo</h3>
<p>Total Dívidas: R$ <span id="total"></span></p>
<p>Total Ganho: R$ <span id="ganho"></span></p>
<p>Falta: R$ <span id="falta"></span></p>
<p class="meta">Meta diária: <span id="meta"></span></p>
</div>

<div class="card">
<h3>Adicionar Dívida</h3>
<input id="nome" placeholder="Nome">
<input id="valor" type="number" placeholder="Valor">
<button onclick="addDivida()">Adicionar</button>
</div>

<div class="card">
<h3>Registrar ganho</h3>
<input id="ganhoDia" type="number" placeholder="Quanto fez hoje">
<button onclick="addGanho()">Registrar</button>
</div>

<div class="card">
<h3>Dias restantes</h3>
<input id="dias" type="number" placeholder="Ex: 7">
<button onclick="render()">Atualizar</button>
</div>

<div class="card">
<h3>Dívidas</h3>
<div id="lista"></div>
</div>

</div>

<script>
let dividas = JSON.parse(localStorage.getItem("dividas")) || [];
let ganhos = JSON.parse(localStorage.getItem("ganhos")) || [];

function salvar() {
  localStorage.setItem("dividas", JSON.stringify(dividas));
  localStorage.setItem("ganhos", JSON.stringify(ganhos));
}

function addDivida() {
  let nome = document.getElementById("nome").value;
  let valor = parseFloat(document.getElementById("valor").value);

  if (!nome || !valor) return alert("Preenche");

  dividas.push({ nome, valor });
  salvar();
  render();
}

function addGanho() {
  let valor = parseFloat(document.getElementById("ganhoDia").value);

  if (!valor) return alert("Valor inválido");

  ganhos.push(valor);
  salvar();
  render();
}

function render() {
  let total = dividas.reduce((s, d) => s + d.valor, 0);
  let ganho = ganhos.reduce((s, g) => s + g, 0);
  let falta = total - ganho;

  let dias = parseInt(document.getElementById("dias").value) || 1;
  let meta = falta / dias;

  document.getElementById("total").innerText = total.toFixed(2);
  document.getElementById("ganho").innerText = ganho.toFixed(2);
  document.getElementById("falta").innerText = falta.toFixed(2);
  document.getElementById("meta").innerText = "R$ " + meta.toFixed(2);

  let lista = document.getElementById("lista");
  lista.innerHTML = "";

  dividas.forEach((d, i) => {
    lista.innerHTML += `
      <div class="card">
        ${d.nome} - R$ ${d.valor}
        <button onclick="remover(${i})">Excluir</button>
      </div>
    `;
  });
}

function remover(i) {
  dividas.splice(i, 1);
  salvar();
  render();
}

render();
</script>

</body>
</html>
