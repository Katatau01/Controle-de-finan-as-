<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Pro</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

.screen { display: none; padding: 15px; }
.active { display: block; }

.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 10px;
}

input, button {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 8px;
  border: none;
}

button {
  background: #22c55e;
  font-weight: bold;
}

.nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  justify-content: space-around;
  background: #020617;
  padding: 10px 0;
}

.nav button {
  background: none;
  color: white;
}

.meta {
  color: #22c55e;
  font-size: 20px;
}
</style>
</head>

<body>

<!-- DASHBOARD -->
<div id="home" class="screen active">
  <h2>📊 Dashboard</h2>

  <div class="card">
    <p>Total Dívidas: R$ <span id="total"></span></p>
    <p>Total Ganho: R$ <span id="ganho"></span></p>
    <p>Falta: R$ <span id="falta"></span></p>
    <p class="meta">Meta diária: <span id="meta"></span></p>
  </div>
</div>

<!-- DÍVIDAS -->
<div id="dividas" class="screen">
  <h2>💸 Dívidas</h2>

  <div class="card">
    <input id="nome" placeholder="Nome da dívida">
    <input id="valor" type="number" placeholder="Valor">
    <button onclick="addDivida()">Adicionar</button>
  </div>

  <div id="lista"></div>
</div>

<!-- GANHOS -->
<div id="ganhos" class="screen">
  <h2>💰 Ganhos</h2>

  <div class="card">
    <input id="ganhoDia" type="number" placeholder="Quanto fez hoje">
    <button onclick="addGanho()">Registrar</button>
  </div>

  <div id="listaGanhos"></div>
</div>

<!-- CONFIG -->
<div id="config" class="screen">
  <h2>⚙️ Config</h2>

  <div class="card">
    <input id="dias" type="number" placeholder="Dias restantes">
    <button onclick="render()">Atualizar</button>
  </div>
</div>

<!-- MENU -->
<div class="nav">
  <button onclick="trocar('home')">🏠</button>
  <button onclick="trocar('dividas')">💸</button>
  <button onclick="trocar('ganhos')">💰</button>
  <button onclick="trocar('config')">⚙️</button>
</div>

<script>
let dividas = JSON.parse(localStorage.getItem("dividas")) || [];
let ganhos = JSON.parse(localStorage.getItem("ganhos")) || [];

function salvar() {
  localStorage.setItem("dividas", JSON.stringify(dividas));
  localStorage.setItem("ganhos", JSON.stringify(ganhos));
}

function trocar(tela) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(tela).classList.add("active");
}

function addDivida() {
  let nome = document.getElementById("nome").value;
  let valor = parseFloat(document.getElementById("valor").value);

  if (!nome || !valor) return alert("Preenche");

  dividas.push({ nome, valor });
  salvar();
  render();
}

function addGanho() {
  let valor = parseFloat(document.getElementById("ganhoDia").value);

  if (!valor) return alert("Valor inválido");

  ganhos.push(valor);
  salvar();
  render();
}

function render() {
  let total = dividas.reduce((s, d) => s + d.valor, 0);
  let ganho = ganhos.reduce((s, g) => s + g, 0);
  let falta = total - ganho;

  let dias = parseInt(document.getElementById("dias").value) || 1;
  let meta = falta / dias;

  document.getElementById("total").innerText = total.toFixed(2);
  document.getElementById("ganho").innerText = ganho.toFixed(2);
  document.getElementById("falta").innerText = falta.toFixed(2);
  document.getElementById("meta").innerText = "R$ " + meta.toFixed(2);

  let lista = document.getElementById("lista");
  lista.innerHTML = "";
  dividas.forEach((d, i) => {
    lista.innerHTML += `
      <div class="card">
        ${d.nome} - R$ ${d.valor}
        <button onclick="removerDivida(${i})">Excluir</button>
      </div>
    `;
  });

  let listaGanhos = document.getElementById("listaGanhos");
  listaGanhos.innerHTML = "";
  ganhos.forEach((g, i) => {
    listaGanhos.innerHTML += `
      <div class="card">
        Dia ${i+1}: R$ ${g}
      </div>
    `;
  });
}

function removerDivida(i) {
  dividas.splice(i, 1);
  salvar();
  render();
}

render();
</script>

</body>
</html>
