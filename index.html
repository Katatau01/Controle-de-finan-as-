<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Pro</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

.screen { display: none; padding: 15px; }
.active { display: block; }

.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 10px;
}

input, button {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 8px;
  border: none;
}

button {
  background: #22c55e;
  font-weight: bold;
}

.nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  justify-content: space-around;
  background: #020617;
  padding: 10px 0;
}

.nav button {
  background: none;
  color: white;
}

.red { color: #ef4444; }
.green { color: #22c55e; }
</style>
</head>

<body>

<!-- DASHBOARD -->
<div id="home" class="screen active">
  <h2>📊 Dashboard</h2>
  <div id="resumo"></div>
</div>

<!-- DÍVIDAS -->
<div id="dividas" class="screen">
  <h2>💸 Dívidas</h2>

  <div class="card">
    <input id="nome" placeholder="Nome">
    <input id="valor" type="number" placeholder="Valor">
    <input id="data" type="date">
    <button onclick="addDivida()">Adicionar</button>
  </div>

  <div id="lista"></div>
</div>

<!-- GANHOS -->
<div id="ganhos" class="screen">
  <h2>💰 Ganhos</h2>

  <div class="card">
    <input id="ganhoDia" type="number" placeholder="Quanto fez hoje">
    <button onclick="addGanho()">Registrar</button>
  </div>
</div>

<div class="nav">
  <button onclick="trocar('home')">🏠</button>
  <button onclick="trocar('dividas')">💸</button>
  <button onclick="trocar('ganhos')">💰</button>
</div>

<script>
let dividas = JSON.parse(localStorage.getItem("dividas")) || [];
let ganhos = JSON.parse(localStorage.getItem("ganhos")) || [];

function salvar() {
  localStorage.setItem("dividas", JSON.stringify(dividas));
  localStorage.setItem("ganhos", JSON.stringify(ganhos));
}

function trocar(tela) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(tela).classList.add("active");
}

function addDivida() {
  let nome = document.getElementById("nome").value;
  let valor = parseFloat(document.getElementById("valor").value);
  let data = document.getElementById("data").value;

  if (!nome || !valor || !data) return alert("Preenche tudo");

  dividas.push({ nome, valor, data });
  salvar();
  render();
}

function addGanho() {
  let valor = parseFloat(document.getElementById("ganhoDia").value);
  if (!valor) return alert("Valor inválido");

  ganhos.push(valor);
  salvar();
  render();
}

function diasRestantes(data) {
  let hoje = new Date();
  let venc = new Date(data);
  let diff = Math.ceil((venc - hoje) / (1000 * 60 * 60 * 24));
  return diff > 0 ? diff : 1;
}

function render() {

  // ordenar por vencimento
  dividas.sort((a,b) => new Date(a.data) - new Date(b.data));

  let totalPago = ganhos.reduce((s,g)=>s+g,0);
  let restante = totalPago;

  let lista = document.getElementById("lista");
  let resumo = document.getElementById("resumo");

  lista.innerHTML = "";
  resumo.innerHTML = "";

  dividas.forEach((d,i)=>{

    let valorRestante = d.valor;

    if (restante > 0) {
      if (restante >= valorRestante) {
        restante -= valorRestante;
        valorRestante = 0;
      } else {
        valorRestante -= restante;
        restante = 0;
      }
    }

    let dias = diasRestantes(d.data);
    let metaDia = valorRestante / dias;

    lista.innerHTML += `
      <div class="card">
        <strong>${d.nome}</strong><br>
        Total: R$ ${d.valor}<br>
        Restante: <span class="${valorRestante>0?'red':'green'}">R$ ${valorRestante.toFixed(2)}</span><br>
        Vence em ${dias} dias<br>
        Meta/dia: R$ ${metaDia.toFixed(2)}<br>
        <button onclick="remover(${i})">Excluir</button>
      </div>
    `;

    resumo.innerHTML += `
      <div class="card">
        ${d.nome} → R$ ${metaDia.toFixed(2)}/dia
      </div>
    `;
  });

}

function remover(i){
  dividas.splice(i,1);
  salvar();
  render();
}

render();
</script>

</body>
</html>
